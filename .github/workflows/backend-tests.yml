name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'data/database/**'
      - 'requirements.txt'
      - 'pytest.ini'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'data/database/**'
      - 'requirements.txt'
      - 'pytest.ini'
      - '.github/workflows/backend-tests.yml'

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest --tb=short

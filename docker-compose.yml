services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicine-box-api
    ports:
      - "${PORT:-8000}:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      OCR_MODE: ${OCR_MODE:-fast}
      USE_GPU: "false"
      USE_SQLITE: "true"
      SQLITE_PATH: data/database/medicines.db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-runs/detect/runs/detect/medicine_box_yolov8n-2/weights/best.pt}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-flash-latest}
      LLM_MOCK_MODE: ${LLM_MOCK_MODE:-false}
      LLM_CACHE_ENABLED: ${LLM_CACHE_ENABLED:-true}
      RATE_LIMIT_EXPLAIN_PER_MINUTE: ${RATE_LIMIT_EXPLAIN_PER_MINUTE:-5}
    volumes:
      # Trained YOLO weights (not in Git — mount from your local training output)
      - ${YOLO_MODEL_HOST_PATH:-./runs/detect/runs/detect/medicine_box_yolov8n-2/weights/best.pt}:${YOLO_MODEL_PATH:-runs/detect/runs/detect/medicine_box_yolov8n-2/weights/best.pt}:ro
      # Persist SQLite database and allow CSV edits on the host
      - ./data/database:/app/data/database
      # Cache EasyOCR model downloads between container restarts
      - easyocr_models:/root/.EasyOCR/model
    restart: unless-stopped

volumes:
  easyocr_models:
